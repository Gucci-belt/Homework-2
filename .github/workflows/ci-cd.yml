name: CI-CD Pipeline (Reusable Validator)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    steps:
      
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # (Sonar ต้องการอันนี้)

      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # --- ขั้นตอน "ส่ง" (Send) ---
      # (ขั้นตอนนี้จะ "ผ่าน" 🟢 ถ้า "ส่ง" สำเร็จ)
      - name: 3. (Validation) SonarCloud Scan [Reusable]
        uses: SonarSource/sonarqube-scan-action@v6 # (ใช้ v6 ที่เสถียร)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # (ถ้าคุณใช้ Option B ให้ใส่ 'with: args:' ไว้ตรงนี้)
        
      # --- 🔽 นี่คือ "หัวใจ" ที่จะทำให้ "พัง" 🔽 ---
      #
      # "ด่านคุมคุณภาพ" (Quality Gate)
      # มันจะ "หยุดรอ" ให้ Sonar วิเคราะห์ (1-2 นาที)
      # แล้ว "ดึงผล" (เกรด A/F) กลับมา
      #
      - name: 3.5 (Validation) Sonar Quality Gate
        uses: SonarSource/sonarcloud-quality-gate-action@master # <-- (นี่คือ "ตัวจริง" ครับ)
        timeout-minutes: 5 # (ตั้งเวลารอ 5 นาที)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
      # --- 🔼 สิ้นสุดขั้นตอน "ด่าน" 🔼 ---

      # --- ขั้นตอน 4-6 จะทำงาน "ต่อเมื่อ" ขั้น 3.5 (Gate) "ผ่าน" 🟢 เท่านั้น ---

      - name: 4. Generate Build Number
        id: build_number
        run: echo "VERSION_NUMBER=1.0.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
        
      - name: 5. Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6. Build and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            gbelt/homework-2:${{ steps.build_number.outputs.VERSION_NUMBER }}
